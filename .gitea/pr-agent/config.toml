# PR-Agent settings for Andon (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Andon, a self-hosted multi-user dashboard in
Go (net/http, html/template, htmx): web/ → services/ → repos/, sources/,
outbound/ → db/, drivers/. It reads many services (Kimai, Invoice Ninja,
homelab tools, LLM providers …), turns their data into tiles and rules
into hints. The PRs are written by an AI agent; review them as a careful
second reader, not as their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Security: credentials in logs, URLs or exports, data of one user or
  space reaching another (rights are checked in services/ only), routes
  without the checks they need.
- Layer breaches: routes or widgets calling repos, sources or drivers
  directly.
- Missing tests for new behaviour; texts missing in one of the catalogs
  (de, en); demo data written in code instead of the demo world.
- Breaches of the repository rules (agent.md).

Skip style, naming and formatting (gofmt, go vet and staticcheck run
separately), praise, and guesses you cannot back with the diff. When you
find nothing that matters, say so in one line.
"""

[pr_code_suggestions]
extra_instructions = """
Only suggestions that fix a bug or a missing check; no style.
"""

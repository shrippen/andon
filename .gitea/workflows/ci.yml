name: ci

# Pilot (16.10.2026): the GitHub mirror runs the same checks
# (.github/workflows/ci.yml, status "github / test") and builds the
# image for ghcr.io. This copy stays for comparison until the pilot ends.
# Branches are tested through their pull request, so a push to a PR
# branch runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:

# One runner works the queue in order. A newer push to the same branch
# or PR replaces the older run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # Latest patch of the Dockerfile's Go line: go.mod's "go 1.26.0" is
        # only the minimum, and 1.26.0 carries known stdlib vulnerabilities.
        with:
          go-version: "1.26"
          check-latest: true
      - run: gofmt -l . | (! grep .)
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go build ./...
      - run: go vet -tags release ./...
      - run: go build -tags release -o andon-release ./cmd/andon && scripts/release-check.sh andon-release
      # internal/web alone takes ~9 min with -race, past go test's default 10m on a busy runner.
      - run: CGO_ENABLED=1 go test -race -timeout 20m ./...

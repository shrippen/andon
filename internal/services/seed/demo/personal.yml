settings:
  goals: {revenue_year: 90000, hours_per_day: 7}
  tax:
    vat: {method: ist, return_interval: monthly, extension: true}
    prepayments: {amount: 1200}
    annual_due: "07-31"
    income_tax_rate: 0.3
  travel: {base: work}
connections:
  - {id: kimai, type: kimai, name: Kimai, url: "demo://kimai", credentials: shared}
  - {id: invoiceninja, type: invoiceninja, name: Invoice Ninja, url: "demo://invoiceninja", credentials: shared}
  - {id: snipeit, type: snipeit, name: Snipe-IT, url: "demo://snipeit", credentials: shared}
  - {id: sure, type: sure, name: Sure, url: "demo://sure", credentials: shared}
  - {id: mail, type: mail, name: Postfach, url: "demo://mail", credentials: shared}
  - {id: paperless, type: paperless, name: Paperless, url: "demo://paperless", credentials: shared}
  - {id: kintsugi, type: kintsugi, name: Kintsugi, url: "demo://kintsugi", credentials: shared}
  - {id: wallos, type: wallos, name: Wallos, url: "demo://wallos", credentials: shared}
  - {id: calendar, type: calendar, name: Kalender, url: "demo://calendar", credentials: shared}
  - {id: evcc, type: evcc, name: Wallbox, url: "demo://evcc", credentials: shared}
  - id: dawarich
    type: dawarich
    name: Dawarich
    url: "demo://dawarich"
    credentials: shared
widgets:
  - {id: kimai-link, type: link, title: Kimai, config: {url: "https://www.kimai.org", icon: "hl-kimai", description: Zeiterfassung, status: "off", info: {connection: kimai}, hotkey: "k"}}
  - {id: in-link, type: link, title: Invoice Ninja, config: {url: "https://invoiceninja.com", icon: "hl-invoice-ninja", description: Rechnungen, status: "off", info: {connection: invoiceninja}, hotkey: "i"}}
  - {id: snipe-link, type: link, title: Snipe-IT, config: {url: "https://snipeitapp.com", icon: "hl-snipe-it", description: Assets, status: "off", info: {connection: snipeit}}}
  - {id: dawarich-link, type: link, title: Dawarich, config: {url: "https://dawarich.app", icon: "hl-dawarich", description: Standortverlauf, status: "off", info: {connection: dawarich}}}
  - {id: sure-link, type: link, title: Sure, config: {url: "https://github.com/we-promise/sure", icon: "hl-maybe", description: Finanzen, status: "off", info: {connection: sure}}}
  - {id: kpi-cash, type: kpi, title: "", connection: sure, config: {metric: cash}}
  - {id: kpi-revenue, type: kpi, title: "", connection: invoiceninja, config: {metric: revenue_ytd}}
  - {id: kpi-open, type: kpi, title: "", connection: invoiceninja, config: {metric: open_amount}}
  - {id: kpi-hours, type: kpi, title: "", connection: kimai, config: {metric: hours_month}}
  - {id: kpi-util, type: kpi, title: "", connection: kimai, config: {metric: utilization}}
  - {id: kpi-vat, type: kpi, title: "", connection: invoiceninja, config: {metric: vat_liability}}
  - {id: kpi-reserve, type: kpi, title: "", connection: invoiceninja, config: {metric: tax_reserve}}
  - {id: hints, type: hints, title: Hinweise, config: {limit: 8}}
  - {id: deadlines, type: deadlines, title: Fristen, config: {days: 60}}
  - {id: open-invoices, type: table, title: Offene Rechnungen, connection: invoiceninja, config: {table: open_invoices}}
  - {id: unbilled, type: table, title: Nicht abgerechnet, connection: kimai, config: {table: unbilled}}
  - {id: revenue-chart, type: chart, title: Umsatz netto, connection: invoiceninja, config: {chart: revenue, months: 12}}
  - {id: budgets, type: progress, title: Projektbudgets, connection: kimai, config: {}}
  - {id: goal, type: progress, title: Jahresziel, connection: invoiceninja, config: {}}
  - {id: assets, type: table, title: Garantie und Lizenzen, connection: snipeit, config: {table: asset_dates}}
  - {id: trips, type: table, title: Fahrten, connection: dawarich, config: {table: trips}}
  - {id: forecast, type: kpi, title: "", connection: invoiceninja, config: {metric: revenue_forecast}}
  - {id: cash, type: kpi, title: "", connection: invoiceninja, config: {metric: cash_30}}
  - {id: cashflow, type: cashflow, title: Liquidität, connection: invoiceninja, config: {}}
  - {id: open-trend, type: trend, title: Offene Posten (Verlauf), connection: invoiceninja, config: {metric: open_amount, days: 90}}
  - {id: acquisition, type: kintsugi, title: Akquise, connection: kintsugi, config: {}}
  - {id: shares, type: table, title: Umsatz je Kunde, connection: invoiceninja, config: {table: client_shares}}
  - {id: light, type: status_light, title: Lage, config: {}}
  - {id: today, type: today, title: Heute, config: {}}
  - {id: recent, type: timeline_recent, title: Zuletzt, config: {}}
  - {id: noise, type: hint_noise, title: Hinweis-Lärm, config: {}}
  - {id: close, type: month_close, title: Monatsabschluss, config: {}}
  - {id: paydays, type: payment_days, title: Zahlungsdauer, connection: invoiceninja, config: {}}
  - {id: rate, type: rate_trend, title: Stundensatz, connection: invoiceninja, config: {target_value: 90}}
  - {id: receipts, type: receipts_missing, title: Belege fehlen, connection: sure, config: {}}
  - {id: subs, type: subscriptions, title: Abos, config: {}}
  - {id: travel, type: travel, title: Unterwegs, connection: dawarich, config: {}}
boards:
  - name: Übersicht
    slug: start
    sections:
      - {title: Dienste, cols: 4, widgets: [kimai-link, in-link, snipe-link, dawarich-link, sure-link]}
      - {title: Kennzahlen, widgets: [kpi-revenue, kpi-open, kpi-hours, kpi-util, kpi-vat, kpi-reserve, kpi-cash]}
      - {title: Hinweise, widgets: [hints, noise]}
      - {title: Lage, area: side, widgets: [light, today, recent]}
      - {title: Fristen, area: side, widgets: [deadlines]}
      - {title: Ziele, area: side, widgets: [goal, budgets]}
  - name: Freelance
    slug: freelance
    sections:
      - {title: Umsatz, widgets: [forecast, cash, rate, revenue-chart, open-trend, cashflow]}
      - {title: Abschluss, widgets: [close, receipts, subs]}
      - {title: Offene Posten, widgets: [open-invoices, unbilled]}
      - {title: Kunden, widgets: [shares, paydays]}
      - {title: Akquise, widgets: [acquisition]}
  - name: IT
    slug: it
    sections:
      - {title: Assets, widgets: [assets]}
  - name: Reisen
    slug: reisen
    sections:
      - {title: Fahrten, widgets: [travel, trips]}

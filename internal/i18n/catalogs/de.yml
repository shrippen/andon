      title: 'Uhr von {name} weicht {seconds} s ab'
      why: 'Der Host {host} hat eine falsche Uhrzeit. Das bricht Zwei-Faktor-Codes, Zertifikatsprüfungen und Zeitpläne. NTP auf dem Host prüfen.'

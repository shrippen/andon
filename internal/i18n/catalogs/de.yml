  options_hint_kintsugi: 'Keine Optionen nötig. Token = API-Token aus Kintsugi → Einstellungen → API-Token (nur lesend, wird einmal angezeigt). URL = Adresse der Kintsugi-Oberfläche.'
  options_hint_sure: Keine Optionen nötig. Token = API-Schlüssel mit Leserecht (Einstellungen → API-Schlüssel).
  options_hint_homeassistant: 'Keine Optionen nötig. Token = langlebiges Zugriffstoken (Profil → Sicherheit). Es hat alle Rechte seines Nutzers: am besten ein eigener Nutzer ohne Admin-Rechte. Schalten dürfen nur Nutzer mit Recht „nutzen“ an dieser Verbindung.'
  options_hint_freshrss: 'Keine Optionen nötig. Benutzername und API-Passwort aus FreshRSS → Profil → API-Passwort; dort muss API-Zugriff erlaubt sein.'
  options_hint_gitea: 'Keine Optionen nötig. Token = Zugriffstoken mit Leserechten (read:user, read:issue, read:repository, read:notification). Repos docker-compose-<host> werden als Compose-Stacks gelesen. Optional IT-Doku (Obsidian-Vault): docs_repo: besitzer/vault, docs_paths: [IT/Dienste, IT/Geräte] – nur diese Ordner, nur das Frontmatter.'
  options_hint_borgbackup: Keine Optionen nötig. Token = API-Token bbs_tok_… (Einstellungen → API).
  options_hint_scrutiny: Keine Optionen, kein Token nötig.
  options_hint_immich: 'Keine Optionen nötig. Token = API-Schlüssel (Konto-Einstellungen → API-Schlüssel). Berechtigungen: server.storage (Pflicht); optional server.statistics und job.read (nur mit Schlüssel eines Admin-Kontos) sowie server.versionCheck für Update-Hinweise.'
  options_hint_umami: 'Keine Optionen nötig. Selbst gehostet: Benutzername und Passwort eines Umami-Kontos. Umami Cloud: Benutzername leer lassen und den API-Schlüssel ins Passwortfeld.'

welcome:
  title: 'Erste Schritte'
  lead: 'Andon ist deine Startseite: Links und Status wie bei Dashy, dazu Zahlen und Hinweise aus deinen Diensten. Diese Seite zeigt, wie alles zusammenhängt, und führt dich durch die ersten Schritte. Du findest sie jederzeit im Menü unter deinem Namen.'
  map_title: 'So hängt alles zusammen'
  map_alt: 'Dienste werden über Verbindungen gelesen, Kacheln zeigen die Daten auf Boards; Regeln machen daraus Hinweise, die dich benachrichtigen.'
  node_services: 'Deine Dienste'
  node_connections: 'Verbindungen'
  node_tiles: 'Kacheln'
  node_boards: 'Boards'
  node_rules: 'Regeln'
  node_hints: 'Hinweise'
  node_notify: 'Benachrichtigungen'
  steps_title: 'Deine ersten Schritte'
  done: 'erledigt'
  go: 'Hinführen'
  dismiss: 'Ich komme zurecht, Liste ausblenden'
  resume: 'Checkliste wieder zeigen'
  concepts_title: 'Die Konzepte'
  intros_again: 'Alle Seiten-Intros wieder zeigen'
  step_connection: 'Eine Verbindung anlegen'
  step_connection_why: 'Eine Verbindung sagt Andon, wo ein Dienst läuft und wie es sich anmeldet, per Token oder direkt beim Dienst.'
  step_credentials: 'Eigene Zugangsdaten hinterlegen'
  step_credentials_why: 'Bei Verbindungen mit persönlichen Zugangsdaten braucht jede Person ihr eigenes Token, sonst bleiben ihre Kacheln leer.'
  step_tile: 'Eine Kachel aufs Board setzen'
  step_tile_why: 'Im Bearbeiten-Modus Kacheln hinzufügen oder mit „Layout vorschlagen“ alles auf einmal anordnen lassen.'
  step_hints: 'Die Hinweise ansehen'
  step_hints_why: 'Hinweise sagen, was zu tun ist, etwa eine überfällige Rechnung oder ein altes Backup, und warum.'
  step_notify: 'Eine Benachrichtigung einrichten'
  step_notify_why: 'Wichtige Hinweise kommen dann per ntfy, Gotify, Matrix, Telegram oder Mail zu dir.'
  step_security: 'Einen zweiten Faktor einrichten'
  step_security_why: 'Ein Passkey oder eine Authenticator-App schützt dein Konto; Admins müssen einen einrichten.'
  step_invite: 'Andere einladen'
  step_invite_why: 'Lade weitere Personen ein; über Teams teilen sie sich Verbindungen, Kacheln und Boards.'
  c_spaces: 'Bereiche und Teams'
  c_spaces_text: 'Alles in Andon gehört einem Bereich: deinem persönlichen, einem Team oder der ganzen Instanz. Der Bereich entscheidet, wer etwas sieht und ändern darf. Teams geben ihren Mitgliedern Rollen (lesen, nutzen, bearbeiten, verwalten); Freigaben öffnen einzelne Boards, Kacheln oder Verbindungen für weitere Personen.'
  c_connections: 'Verbindungen'
  c_connections_text: 'Eine Verbindung ist der Zugang zu einem Dienst: Adresse, Zugangsdaten, Optionen. Geteilte Zugangsdaten gelten für alle, die die Verbindung nutzen dürfen, und zeigen allen dieselben Daten; bei persönlichen hinterlegt jede Person ihr eigenes Token. Manche Dienste melden sich statt mit Token direkt an (Home Assistant, Nextcloud, Jellyfin, Gitea, Snipe-IT, Tailscale). Der Test-Knopf prüft eine Verbindung sofort.'
  c_tiles: 'Kacheln, Bibliothek und Galerie'
  c_tiles_text: 'Eine Kachel zeigt etwas an: Links, eine Uhr, Stunden aus Kimai, den Zustand deiner Festplatten. Neue Kacheln kommen aus der Galerie „Kachel hinzufügen“, mit Vorschau aus echten oder Beispieldaten. Jede Kachel liegt in der Bibliothek ihres Bereichs und kann auf mehreren Boards stehen; eine Änderung wirkt dann überall.'
  c_boards: 'Boards: Bearbeiten und Mein Layout'
  c_boards_text: 'Ein Board ist eine Seite aus Abschnitten mit Kacheln. „Bearbeiten“ ändert das Board für alle, die es sehen (mit Verlauf und Rückgängig); „Layout vorschlagen“ baut ein Board aus deinen Kacheln und Verbindungen auf. „Mein Layout“ ändert nur deine eigene Ansicht: Reihenfolge, eingeklappte Abschnitte, ausgeblendete Kacheln.'
  c_hints: 'Hinweise'
  c_hints_text: 'Ein Hintergrundlauf liest regelmäßig alle Dienste; Regeln machen aus den Daten Hinweise mit Begründung. Rot heißt heute handeln, Gelb einplanen, Blau gut zu wissen. Hinweise lassen sich erledigen, zurückstellen oder als „so gewollt“ markieren; die Schwellen jeder Regel sind einstellbar.'
  c_notify: 'Benachrichtigungen'
  c_notify_text: 'Wichtige Hinweise kommen als Push über Apprise zu dir, mit Ruhezeiten und Wiederholung. Dazu gibt es einen täglichen oder wöchentlichen Überblick per Mail, auf Wunsch mit KI-Zusammenfassung, und einen iCal-Kalender für Fristen.'
  c_freelance: 'Abrechnung und Zeitleiste'
  c_freelance_text: 'Mit Kimai und Invoice Ninja zeigt Andon offene Stunden, Rechnungen, Auslastung und eine Jahresprognose. Unter „Abrechnung“ wird aus offener Zeit mit einem Klick ein Rechnungsentwurf. Die Zeitleiste zeigt Updates und Hinweise der letzten Tage.'
  c_receipts: 'Belege zuordnen'
  c_receipts_text: 'Invoice Ninja führt Ausgaben, Paperless die Belege. Statt jeden Beleg doppelt hochzuladen, bleibt er in Paperless und wird mit seiner Ausgabe verknüpft, in beide Richtungen: Die Ausgabe bekommt einen Link zum Beleg, der Beleg Ausgabennummer und Link zur Ausgabe. Andon schlägt Paare nach Betrag, Datum, Lieferant und Rechnungsnummer vor und begründet jeden Vorschlag; verknüpft wird nur per Klick. Eine eigene Liste führt Andon dabei nicht: Ob etwas verknüpft ist, steht in den Feldern beider Programme, die du einmal unter „Felder“ zuordnest.'
  c_themes: 'Themes'
  c_themes_text: 'Aussehen und Farben kommen aus Themes. Mitgeliefert ist Kante in dunkel und hell; eigene Themes entstehen im Theme-Editor mit Kontrastprüfung und lassen sich pro Bereich oder Board wählen.'
  c_security: 'Sicherheit und Anmeldung'
  c_security_text: 'Andon hat eine eigene Anmeldung mit Passwort, Passkeys, TOTP und optional Single Sign-on über OIDC. Zugangsdaten der Dienste liegen verschlüsselt in einer verschlüsselten Datenbank und erreichen nie den Browser.'
intro:
  title: 'Was ist das hier?'
  more: 'Mehr im Leitfaden'
  close: 'Verstanden, ausblenden'
  board: 'Ein Board zeigt deine Kacheln in Abschnitten. „Bearbeiten“ ändert es für alle, „Mein Layout“ nur für dich; beides lässt sich rückgängig machen.'
  connections: 'Verbindungen gibt es für dich, je Team und für die ganze Instanz. Jede ist fest (ein Zugang für alle) oder eine Vorlage (jede Person trägt ihren eigenen ein).'
  library: 'Die Bibliothek enthält alle Kacheln deiner Bereiche, auch die, die gerade auf keinem Board stehen. Eine Kachel kann auf mehreren Boards stehen.'
  gallery: 'Wähle, was eine neue Kachel zeigen soll. Die Vorschau nutzt deine Verbindungen oder Beispieldaten, wenn noch keine passende da ist.'
  hints: 'Hinweise entstehen aus Regeln über die Daten deiner Dienste. Jeder sagt, warum er erscheint und wo du ihn erledigst.'
  spaces: 'Hier stellst du ein, wie Andon diesen Bereich auswertet: Seitenkopf, Ziele und Kosten, Steuer und die Schwellwerte der Hinweise.'
  teams: 'Teams teilen Verbindungen, Kacheln und Boards. Die Rolle eines Mitglieds bestimmt, was es damit tun darf.'
  themes: 'Themes bestimmen Farben und Schriften. Jede Änderung wird auf Lesbarkeit geprüft.'
  notify: 'Lege fest, wie wichtige Hinweise dich erreichen: Push über Apprise, Ruhezeiten und ein Überblick per Mail.'
  billing: 'Offene Kimai-Stunden je Kunde. Mit einem Klick entsteht daraus ein Rechnungsentwurf in Invoice Ninja.'
  timeline: 'Die Zeitleiste zeigt, was sich in den letzten 14 Tagen geändert hat: Updates und Neustarts der Dienste, Hinweise, die kamen oder gingen. So findest du, was kurz vor einem Problem passiert ist.'
  receipts: 'Invoice-Ninja-Ausgaben finden hier ihre Belege aus Paperless. Andon schlägt vor, du bestätigst; die Verweise stehen danach auf beiden Seiten.'
  boards: 'Alle Boards, die du siehst. Reihenfolge und Auswahl gelten nur für deine Navigation.'
  credentials: 'Verbindungen mit persönlichen Zugangsdaten. Dein Token sieht nur du.'
  import: 'Dashy conf.yml oder YAML-Export in einen Bereich übernehmen.'
  clients: 'Jeder Kunde aus Kimai mit seinem Invoice-Ninja-Kunden gleichen Namens: Stunden, offene Arbeit, Rechnungen, Umsatz und Zahlungsdauer.'
  hosts: 'Jeder Rechnername aus deinen Verbindungen mit allem, was darauf zeigt: Dienste, Monitore, Zertifikate, Hinweise.'
  users: 'Konten verwalten. Persönliche Inhalte sind für Admins nicht sichtbar.'
  instance: 'Einstellungen für die ganze Instanz: Prüflauf, Zustand, Sicherung, Netz und Anmeldung. Nur Admins sehen diese Seite.'
  audit: 'Wer hat wann was geändert. Einstellungen erscheinen mit altem und neuem Wert; Einträge bleiben ein Jahr.'
  profile: 'Name, Sprache, Theme, Startboard und Suchmaschine gelten nur für dich.'
  security: 'Passwort, zweiter Faktor, Passkeys, Sitzungen und API-Tokens deines Kontos. Ein Passkey genügt als zweiter Faktor.'

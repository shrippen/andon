connect:
  token: Zugangsdaten eintragen
  title: Anmelden
  button: 'Mit {service} anmelden'
  after_save: Nach dem Speichern kannst du dich hier auch direkt beim Dienst anmelden, statt ein Token einzutragen.
  done: Angemeldet. Andon nutzt jetzt den Zugang aus der Anmeldung.
  how_homeassistant: Du meldest dich bei Home Assistant an und erlaubst den Zugriff. Andon legt dann in deinem Profil ein langlebiges Token „Andon …“ an. In Home Assistant ist nichts einzurichten.
  how_nextcloud: Nextcloud öffnet sich in einem neuen Tab. Nach der Anmeldung legt Nextcloud ein App-Passwort für Andon an (Einstellungen → Sicherheit). Die Serverinfo braucht ein Admin-Konto.
  how_mediaserver: Andon zeigt einen Code, den du in Jellyfin unter Profil → Quick Connect eingibst. Quick Connect muss im Dashboard eingeschaltet sein. Alle Sitzungen sieht nur ein Admin-Konto.
  how_gitea: Einmalig in Gitea eine OAuth2-Anwendung anlegen (Einstellungen → Anwendungen) mit der Weiterleitungs-URL unten und Client-ID und Secret hier eintragen. Danach meldet sich jeder mit seinem Gitea-Konto an; Andon fragt nur Lesezugriff auf Benutzer, Repositories, Issues und Benachrichtigungen an.
  how_snipeit: Einmalig in Snipe-IT einen OAuth-Client anlegen (Einstellungen → OAuth) mit der Weiterleitungs-URL unten und Client-ID und Secret hier eintragen. Danach meldet sich jeder mit seinem Snipe-IT-Konto an; die Rechte folgen dem Konto.
  how_tailscale: In der Tailscale-Admin-Konsole einen OAuth-Client mit dem Scope devices:core:read anlegen (Einstellungen → OAuth-Clients) und Client-ID und Secret hier eintragen. Andon holt sich damit selbst kurzlebige Tokens; nichts läuft nach 90 Tagen ab.
  redirect_uri: 'Weiterleitungs-URL:'
  client_id: Client-ID
  client_secret: Client-Secret
  client_save: Client speichern
  client_set: Client eingetragen
  client_missing: Anmelden geht, sobald ein Verwalter den OAuth-Client dieser Verbindung eingetragen hat.

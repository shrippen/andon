  options_hint_nextcloud: 'Keine Optionen. Benutzername und App-Passwort eines Admin-Kontos (Einstellungen → Sicherheit → App-Passwort). Alternativ Benutzername leer lassen und den serverinfo-Token ins Passwortfeld (occ config:app:set serverinfo token --value …).'
  options_hint_sabnzbd: Keine Optionen. Token = API-Schlüssel (Konfiguration → Allgemein).
  options_hint_gluetun: 'URL des Control-Servers (http://gluetun:8000). Optionen: country: Sweden (erwartetes Ausgangsland). Token = API-Schlüssel, falls gesetzt.'
  options_hint_domains: 'URL = eine Adresse der Domain. Optionen: domains: [example.org, example.de]. Kein Token. .de nennt kein Ablaufdatum.'
  options_hint_blacklist: 'URL = Mailserver (dessen IPv4-Adressen werden geprüft). Optionen: ips: [1.2.3.4], zones: [zen.spamhaus.org]. Kein Token.'
  options_hint_truenas: 'Keine Optionen. URL mit https:// (z. B. https://truenas.lan) – TrueNAS widerruft einen API-Schlüssel, der über http benutzt wird; bei selbstsigniertem Zertifikat TLS auf „unsicher“ stellen. Token = API-Schlüssel (Anmeldedaten → Benutzer → API-Schlüssel) eines Nutzers mit der Rolle „Readonly Admin“. Nutzt die WebSocket-API, ältere Versionen REST.'
  options_hint_komodo: 'API-Key und -Secret aus Komodo (nur lesend genügt). Optionen (YAML): stopped: [cloudbeaver, filezilla] für absichtlich gestoppte Stacks (grau, kein Hinweis).'
  options_hint_pangolin: 'URL der Integration-API inkl. /v1 (z. B. https://api.pangolin.example.org/v1), nicht die Pangolin-Oberfläche: Die Integration-API in der Pangolin-config.yml einschalten (flags: enable_integration_api: true) und über eine eigene Domain erreichbar machen (Port 3003). Organisations-ID steht in der Pangolin-URL (…/<org>/settings). Token = Integration-API-Schlüssel mit Leserechten auf Sites und Ressourcen.'
  options_hint_authentik: Keine Optionen. Token = API-Token eines Kontos mit Leserechten auf Ereignisse und Benutzer.
  options_hint_mail: 'URL imaps://mail.example.org:993/INBOX. Benutzername und App-Passwort deines Postfachs (nicht das normale Login-Passwort). Optionen: days: 60, keywords: [abrechnung], ignore_senders: [meinefirma.de] – nur lesend; Anhänge werden nur geladen, wenn du eine Rechnung an Paperless übergibst.'
  options_hint_hansei: 'Keine Optionen, kein Token. Hansei schickt seinen Stand an die Webhook-Adresse unten (Batches, Konformität, Doku-Befunde in Arbeit). Befunde holt es mit einem Lese-Token über /api/docs.'
  options_hint_pgbackweb: Keine Optionen, kein Token. PG Back Web meldet sich per Webhook, siehe unten.
  hook: Webhook

  concept: 'What is this for?'
  concept_why: 'Invoice Ninja keeps expenses but is no document store; Paperless is. Instead of uploading every receipt to both, it stays in Paperless only and the expense gets a link to it.'
  concept_link: '“Link” writes both sides: the link to the receipt on the expense, the expense number and a link to the expense on the receipt, plus the invoice number wherever it is missing. So you can jump either way. Which fields take this, you set under “Fields”.'

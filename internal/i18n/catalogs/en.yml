  options_hint_invoiceninja: 'Token = API token (settings → account management → API tokens). Rights follow the token''s user: view clients, invoices, quotes, payments, expenses and vendors; draft invoices from Kimai also need “create invoices”. Options: currency: EUR · home_country_id: 276 (Germany). “Match receipts” also needs “edit expenses”.'

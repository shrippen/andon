  what_pbs: 'Proxmox Backup Server stores deduplicated backups of Proxmox VE guests in datastores.'
  options_hint_kopia: 'URL of the Kopia server (kopia server start), e.g. https://kopia.example.lan:51515. Token = user:password of the server UI (--server-username/--server-password).'
  about_kopia: 'Snapshots per source'
  what_kopia: 'Kopia backs up folders as encrypted, deduplicated snapshots; the Kopia server manages several sources.'

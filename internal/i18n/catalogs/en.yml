  what_prometheus: 'Prometheus collects metrics (e.g. via node_exporter) and fires alerts by its rules.'
  secret_prometheus: 'Token or user:password (empty = no login)'
  options_hint_nvd: 'The URL stays https://services.nvd.nist.gov. API key optional (nvd.nist.gov/developers/request-an-api-key); without one the NVD allows 5 requests in 30 seconds. Option days: that many days back (default 30, at most 120). High and critical CVEs are read and checked against the images of Docker and the compose stacks (Gitea) in the same space.'
  about_nvd: 'New CVEs against running images'
  what_nvd: 'The National Vulnerability Database (NIST) publishes every known vulnerability (CVE) with its score and the versions it affects.'
  secret_nvd: 'API key (optional)'
  options_hint_drone: 'URL of the Drone server, e.g. https://drone.example.org. Token = personal token (Drone → user settings). The active repos and the last 10 builds of their default branch are read; pull requests do not count.'
  about_drone: 'Builds per repo'
  what_drone: 'Drone is a CI server: it builds and tests repos on every push.'
  options_hint_pbs: 'URL of the server with port, e.g. https://pbs.example.lan:8007. Token = API token as user@realm!tokenname:secret; the role DatastoreAudit on / is enough. Datastores, backup groups and verify runs are read.'

    replace_worth:
      title: '{name}: replacement pays back in {months} months'
      why: '{years} years old, draws {watts} W ({yearly} power a year). A {new_watts} W device for {new_cost} pays back after {months} months.'
    warranty:
      title: Warranty of {asset} ends on {day}
      why: Asset {tag}. Extend or plan a replacement.
    eol:
      title: '{asset} reached end of life'
      why: EOL date {day} ({tag}). Plan a replacement.
    license:
      title: Licence {license} expires on {day}
      why: Renew or cancel.
    seats:
      title: '{license}: no free seats'
      why: All {seats} seats are assigned.
    audit:
      title: 'Audit overdue: {asset}'
      why: The next audit date has passed.
    stock:
      title: '{item}: only {left} left'
      why: Minimum stock {min}.
    unused:
      title: 'Unused devices: {count} for over {days} days'
      why: 'Ready to deploy but not assigned; longest ({oldest} days): {names}. Sell, use, or switch the rule off if this is normal for you.'
    gwg:
      title: '{asset}: {net} net'
      why: 'Above 800 € net: check depreciation instead of immediate write-off (GWG).'
    expense_missing:
      title: No expense for {asset}
      why: Bought on {day} for {amount}, no matching expense in Invoice Ninja.
    checkin_overdue:
      title: '{asset} was due back on {day}'
      why: 'Checked out to {who}. Ask for it or extend the return date in Snipe-IT.'
  geo:
    visit_without_time:
      title: '{customer} on {day}: no time booked'
      why: Dawarich shows {hours} h on site, Kimai has no entry for this client.
    time_without_visit:
      title: On-site booking without visit ({day})
      why: Kimai entry at {customer} marked on site, Dawarich shows no stay.
    travel_costs:
      title: 'Travel costs {month}: {amount}'
      why: '{trips} business rides, {km} km of them by car or motorbike as Dawarich tracked them. Record as expense or invoice item.'
    per_diem:
      title: 'Per diem {month}: {amount}'
      why: '{days} days away with a business ride, {full} of them full days (14 € from 8 h and on travel days, 28 € a full day).'
    travel_unbilled:
      title: 'Travel {customer} {month}: {amount} not invoiced'
      why: '{km} business km to this client, no invoice since has a travel line.'
    unplaced:
      title: '{count} frequent destinations without a place'
      why: 'Rides of the last {days} days end there; unassigned they stay private. {names}'
    plugin_missing:
      title: '{count} business rides {month} missing in Kimai mileage'
      why: '{km} km as Dawarich tracked them, no plugin trip at the same time.'
    car_private_share:
      title: 'Business car {year}: {share} % private'
      why: 'Of {km} km by car. Above 50 % private the 1 % method is not allowed (logbook or private asset).'
    tracks_missing:
      title: Dawarich without tracks
      why: 'This Dawarich version has no tracks; distances and times are estimated from visits (straight line × 1.3).'
    tracks_failed:
      title: Dawarich tracks unreadable
      why: 'The tracks could not be read; distances and times are estimated from visits.'
    no_data:
      title: No location data for {hours} h
      why: Tracking app off or offline?
  tax:
    vat_return:
      title: VAT return {period} due {day}
      why: Deadline from the space's tax settings.
    vat_return_amount:
      title: 'VAT return {period} due {day}: about {amount}'
      why: Estimated liability from Invoice Ninja (output minus input VAT).
    prepayment:
      title: Income tax prepayment on {day}
      why: Quarterly prepayment.
    prepayment_amount:
      title: Income tax prepayment {amount} on {day}
      why: Quarterly prepayment.
    annual:
      title: Tax returns {year} due {day}
      why: Profit statement, income tax and VAT return.
  system:
    unused_service:
      title: '{name} unused for {days} days'
      why: '{kind}: no tile clicks, no logins, no visitors. Uses {gb} GB RAM. Switch off?'
    storage_forecast:
      title: '{name} full in {days} days'
      why: 'Now {percent} % used; at the last 30 days pace full on {day}.'
    slower_since_update:
      title: '{monitor} slower since update'
      why: '{subject} was updated on {day}; response time before {before} ms, since {now} ms.'
    token_expires:
      title: '{name}: token expires'
      why: 'Valid until {day}. Create a new token and store it in the connection.'
    token_old:
      title: '{name}: token unchanged for {days} days'
      why: 'Stored on {since}. Replace old tokens regularly.'
    outage:
      title: '{host} unreachable'
      why: '{count} services affected: {names}. Their single hints are held back.'
    connector_down:
      title: '{name} unreachable'
      why: 'Last fetch failed: {error}. Tiles show the last data.'
    partner_ambiguous:
      title: 'Several connections for {services}'
      why: 'Andon does not know which belongs with which connection of other services. Hints that need several services are missing for them. Assign them under Verbünde in the space settings.'
    backup_late:
      title: 'Andon backup {hours} hours old'
      why: 'The daily database copy did not happen. Check that the service runs and data/backups is writable.'
    backup_failed:
      title: 'Andon backup failed'
      why: 'The last copy failed its restore test and was discarded.'
    clock_skew:
      title: '{name}''s clock is off by {seconds} s'
      why: 'Host {host} has the wrong time. That breaks two-factor codes, certificate checks and schedules. Check NTP on the host.'
  glances:
    disk_full:
      title: '{mount} is {percent} % full'
      why: 'A full file system stops services and backups. Clean up or grow it.'
    load_high:
      title: 'Load {load} on {cores} cores'
      why: 'Processes have waited for the CPU for at least 5 minutes. Check running jobs.'
    swap_high:
      title: 'Swap {percent} % used'
      why: 'Memory runs short and everything slows down. Check memory-hungry services.'
  wallos:
    renewal_soon:
      title: '{name} renews on {day}'
      why: '{amount} for the next term. To cancel, do it before.'
  docker:
    unhealthy:
      title: 'Container {name} is unhealthy'
      why: 'It runs, but its health check fails ({status}). Check the logs.'
    crashed:
      title: 'Container {name} is not running'
      why: '{status}. Restart it or check the logs for the error.'

welcome:
  title: 'Getting started'
  lead: 'Andon is your start page: links and status like Dashy, plus numbers and hints from your services. This page shows how it fits together and walks you through the first steps. You find it any time in the menu under your name.'
  map_title: 'How it fits together'
  map_alt: 'Services are read through connections, tiles show the data on boards; rules turn it into hints that notify you.'
  node_services: 'Your services'
  node_connections: 'Connections'
  node_tiles: 'Tiles'
  node_boards: 'Boards'
  node_rules: 'Rules'
  node_hints: 'Hints'
  node_notify: 'Notifications'
  steps_title: 'Your first steps'
  done: 'done'
  go: 'Take me there'
  dismiss: 'I can manage, hide the list'
  resume: 'Show the checklist again'
  concepts_title: 'The concepts'
  intros_again: 'Show all page intros again'
  step_connection: 'Add a connection'
  step_connection_why: 'A connection tells Andon where a service runs and how to sign in, with a token or by signing in with the service.'
  step_credentials: 'Add your own credentials'
  step_credentials_why: 'Connections with personal credentials need each person''s own token, or their tiles stay empty.'
  step_tile: 'Put a tile on a board'
  step_tile_why: 'Add tiles in edit mode, or let “Suggest layout” arrange everything at once.'
  step_hints: 'Look at the hints'
  step_hints_why: 'Hints say what needs doing, like an overdue invoice or an old backup, and why.'
  step_notify: 'Set up a notification'
  step_notify_why: 'Important hints then reach you via ntfy, Gotify, Matrix, Telegram or mail.'
  step_security: 'Set up a second factor'
  step_security_why: 'A passkey or an authenticator app protects your account; admins must set one up.'
  step_invite: 'Invite others'
  step_invite_why: 'Invite more people; through teams they share connections, tiles and boards.'
  c_spaces: 'Spaces and teams'
  c_spaces_text: 'Everything in Andon belongs to a space: your personal one, a team or the whole instance. The space decides who sees and changes what. Teams give members roles (view, use, edit, manage); shares open single boards, tiles or connections to more people.'
  c_connections: 'Connections'
  c_connections_text: 'A connection is the access to a service: address, credentials, options. Shared credentials apply to everyone allowed to use the connection and show them the same data; with personal ones each person adds their own token. Some services sign in directly instead of a token (Home Assistant, Nextcloud, Jellyfin, Gitea, Snipe-IT, Tailscale). The test button checks a connection right away.'
  c_tiles: 'Tiles, library and gallery'
  c_tiles_text: 'A tile shows something: links, a clock, hours from Kimai, the health of your disks. New tiles come from the “Add a tile” gallery, previewed with real or sample data. Each tile lives in its space''s library and can sit on several boards; a change then applies everywhere.'
  c_boards: 'Boards: edit and my layout'
  c_boards_text: 'A board is a page of sections with tiles. “Edit” changes the board for everyone who sees it (with history and undo); “Suggest layout” builds a board from your tiles and connections. “My layout” changes only your own view: order, folded sections, hidden tiles.'
  c_hints: 'Hints'
  c_hints_text: 'A background run reads all services regularly; rules turn the data into hints with a reason. Red means act today, yellow plan it, blue good to know. Hints can be resolved, snoozed or marked as intended; each rule''s thresholds can be changed.'
  c_notify: 'Notifications'
  c_notify_text: 'Important hints reach you as push through Apprise, with quiet hours and repeats. There is also a daily or weekly overview by mail, optionally with an AI summary, and an iCal calendar for deadlines.'
  c_freelance: 'Billing and timeline'
  c_freelance_text: 'With Kimai and Invoice Ninja, Andon shows open hours, invoices, utilisation and a forecast for the year. Under “Billing” open time becomes a draft invoice in one click. The timeline shows updates and hints of the last days.'
  c_receipts: 'Match receipts'
  c_receipts_text: 'Invoice Ninja keeps expenses, Paperless the receipts. Instead of uploading every receipt twice, it stays in Paperless and is linked to its expense in both directions: the expense gets a link to the receipt, the receipt the expense number and a link to the expense. Andon suggests pairs by amount, date, vendor and invoice number and explains each suggestion; only your click links. Andon keeps no list of its own: whether something is linked is in the fields of both programs, which you map once under “Fields”.'
  c_themes: 'Themes'
  c_themes_text: 'Look and colours come from themes. Kante ships in dark and light; your own themes are made in the theme editor with a contrast check and can be chosen per space or board.'
  c_security: 'Security and sign-in'
  c_security_text: 'Andon has its own sign-in with password, passkeys, TOTP and optional single sign-on via OIDC. Service credentials are stored encrypted in an encrypted database and never reach the browser.'
intro:
  title: 'What is this?'
  more: 'More in the guide'
  close: 'Got it, hide'
  board: 'A board shows your tiles in sections. “Edit” changes it for everyone, “My layout” only for you; both can be undone.'
  connections: 'Here are the accesses to your services. Each connection can be tested right away; with personal credentials each person adds their own token.'
  library: 'The library holds all tiles of your spaces, including those not on any board right now. A tile can sit on several boards.'
  gallery: 'Pick what a new tile should show. The preview uses your connections, or sample data if none fits yet.'
  hints: 'Hints come from rules over your services'' data. Each says why it appears and where you resolve it.'
  spaces: 'Here you set how Andon evaluates this space: page header, goals and costs, tax and the thresholds of hints.'
  teams: 'Teams share connections, tiles and boards. A member''s role decides what they may do with them.'
  themes: 'Themes set colours and fonts. Every change is checked for readability.'
  notify: 'Choose how important hints reach you: push through Apprise, quiet hours and an overview by mail.'
  billing: 'Open Kimai hours per customer. One click turns them into a draft invoice in Invoice Ninja.'
  timeline: 'The timeline shows what changed in the last 14 days: service updates and restarts, hints that came or went. It helps to find what happened just before a problem.'
  receipts: 'Invoice Ninja expenses find their Paperless receipts here. Andon suggests, you confirm; afterwards both sides reference each other.'
  boards: 'Every board you can see. Order and selection apply to your navigation only.'
  credentials: 'Connections with personal credentials. Only you see your token.'
  import: 'Take over a Dashy conf.yml or a YAML export into a space.'
  clients: 'Each Kimai customer with the Invoice Ninja client of the same name: hours, open work, invoices, revenue and payment time.'
  hosts: 'Every machine name of your connections with everything aimed at it: services, monitors, certificates, hints.'
  users: 'Manage accounts. Personal content is not visible to admins.'
  instance: 'Settings for the whole instance: check run, health, backup, network and sign-in. Only admins see this page.'
  audit: 'Who changed what, and when. Settings show their old and new value; entries are kept for a year.'
  profile: 'Name, language, theme, start board and search engine apply to you only.'
  security: 'Password, second factor, passkeys, sessions and API tokens of your account. A passkey counts as a second factor.'

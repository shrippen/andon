  after_save: After saving you can also sign in with the service here instead of entering a token.
  done: Signed in. Andon now uses the access from the sign-in.
  how_homeassistant: You sign in to Home Assistant and allow access. Andon then creates a long-lived token “Andon …” in your profile. Nothing to set up in Home Assistant.
  how_nextcloud: Nextcloud opens in a new tab. After signing in, Nextcloud creates an app password for Andon (settings → security). Server info needs an admin account.
  how_mediaserver: Andon shows a code you enter in Jellyfin under profile → Quick Connect. Quick Connect must be enabled in the dashboard. Only an admin account sees all sessions.
  how_gitea: Once, create an OAuth2 application in Gitea (settings → applications) with the redirect URL below and enter client ID and secret here. Then everyone signs in with their Gitea account; Andon only asks for read access to user, repositories, issues and notifications.
  how_snipeit: Once, create an OAuth client in Snipe-IT (settings → OAuth) with the redirect URL below and enter client ID and secret here. Then everyone signs in with their Snipe-IT account; rights follow the account.
  how_tailscale: In the Tailscale admin console create an OAuth client with scope devices:core:read (settings → OAuth clients) and enter client ID and secret here. Andon then fetches short-lived tokens itself; nothing expires after 90 days.

      title: Budget {project} {percent} % used
      why: The project's money or time budget is (almost) used up.
    pace:
      title: '{project}: budget will not last until {end}'
      why: At the pace of the last 30 days it reaches {forecast} instead of {budget}.
    utilization:
      title: Utilisation {percent} % (goal {goal} %)
      why: Billable hours this month compared with target time (without holidays and absences).
    overtime:
      title: '{hours} h per week on average'
      why: The last {weeks} weeks were above {limit} h.
    monthly_close:
      title: 'Month end {month}: {hours} h open'
      why: Billable entries of last month are not exported yet.
  in:
    rate_below:
      title: '{client}: really {full} per hour'
      why: 'Billed at {nominal} per hour; with {other} h internal work and {travel} h travel it is {full} (last 90 days).'
    order_gap:
      title: 'Less work than last year'
      why: 'Last 4 weeks {recent} h, a year ago {last_year} h; the following weeks then brought {ahead} h. Open quotes: {quotes} ({quote_sum}).'
    concentration_hours:
      title: '{client}: {percent} % of revenue'
      why: 'Concentration risk: one client brings most of the last 12 months revenue and {hours} % of your hours.'
    concentration_pension_hours:
      title: '{client}: {percent} % of revenue'
      why: 'Over 5/6 of revenue and {hours} % of hours from one client: check pension insurance duty as a quasi-employee (German § 2 No. 9 SGB VI).'
    payment_worse:
      title: '{client} pays slower'
      why: 'Recently after {recent} days, usually after {avg}. Talk about payment terms or agree on instalments.'
    overdue:
      title: 'Overdue for {days} days: invoice {number}'
      why: '{client}, open: {amount}.'
    overdue_dunning:
      title: '{days} days open, reminder due: {number}'
      why: '{client}, open: {amount}. Send a payment reminder.'
    slow_payer:
      title: '{client} typically pays after {days} days'
      why: Typical time from invoice to payment is above {limit} days.
    draft_stale:
      title: Draft invoice for {client} since {days} days
      why: Draft worth {amount} has not been sent.
    quote_open:
      title: Quote {number} without reply ({days} days)
      why: '{client} has not replied yet. Follow up?'
    recurring_ending:
      title: Recurring invoice for {client} ends
      why: The last invoice goes out on {day}.
    revenue_goal:
      title: Revenue below annual goal
      why: So far {ytd} net, expected pro rata {expected} (goal {goal}).
    missing_vat_domestic:
      title: Invoice {number} without VAT
      why: 'Domestic client {client}: regular taxation requires VAT.'
    missing_vat_eu:
      title: 'Invoice {number}: VAT ID missing'
      why: '{client} is abroad and the invoice has no VAT. Reverse charge needs the client''s VAT ID.'
    expense_no_vat:
      title: 'Expense {number} from {vendor} without input VAT ({amount})'
      why: '{notes} on {day}: no input VAT recorded.'
    concentration:
      title: '{client}: {percent} % of revenue'
      why: 'Concentration risk: one client makes up most revenue of the last 12 months.'
    concentration_pension:
      title: '{client}: {percent} % of revenue'
      why: 'More than 5/6 of revenue from one client: check German pension insurance duty (§ 2 Nr. 9 SGB VI).'
    overdue_client:
      title: '{count} invoices overdue: {client} ({amount})'
      why: 'Oldest for {days} days: {numbers}. Send reminders per invoice in Invoice Ninja.'
